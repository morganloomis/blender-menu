schema_version = "1.0.0"
id = "blender_menu"
name = "Blender Tree Menus"
tagline = "Folder-based tree menus in the 3D Viewport; scripts with main() become menu items"
version = "1.0.0"
type = "add-on"
blender_version_min = "5.0.0"
maintainer = "Morgan Loomis <morganloomis@gmail.com>"
license = ["SPDX:GPL-2.0-or-later"]
tags = ["Interface", "Menu", "UI"]

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".git",
    "*.zip",
    ".github/",
    "openspec/",
    ".cursor/",
    "dist/",
    "build_index.py",
    "*.code-workspace",
]
